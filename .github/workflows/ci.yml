name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev ninja-build doxygen python3-numpy python3-matplotlib python3-venv python3-pip

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DDSPECM1D_BUILD_TESTS=ON \
            -DDSPECM1D_BUILD_BENCHMARKS=ON \
            -DDSPECM1D_BUILD_TUTORIALS=ON \
            -DDSPECM1D_BUILD_TOOLS=ON \
            -DDSPECM1D_ENABLE_SMOKE_TESTS=ON \
            -DDSPECM1D_BUILD_DOCS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run Python plotting checks
        run: python3 -m unittest discover -s tests -p "test_*.py"

      - name: Run unit and component tests
        run: ctest --test-dir build --output-on-failure -L "unit|component"

      - name: Run smoke checks
        run: ctest --test-dir build --output-on-failure -L dspecm1d_smoke

      - name: Check first-seismogram plot
        run: python3 plotting/functions/first_seismogram.py build/output/first_seismogram.out_t.out --save build/output/first_seismogram.png --no-show

      - name: Build docs site
        run: cmake --build build --target website

      - name: Check internal documentation links
        run: python3 tests/check_site_links.py build/site

  love-numbers:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev ninja-build

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DDSPECM1D_BUILD_LOVE_NUMBERS=ON \
            -DDSPECM1D_BUILD_TESTS=ON \
            -DDSPECM1D_ENABLE_PAPER_VALIDATION=OFF

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run complete normal test suite
        run: ctest --test-dir build --output-on-failure -L "unit|component"
