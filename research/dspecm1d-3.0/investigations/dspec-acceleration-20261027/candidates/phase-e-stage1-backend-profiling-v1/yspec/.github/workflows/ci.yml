name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Two GCCs and Clang, both build types. Clang needs an OpenMP runtime of its
  # own (libomp); the GCC entries use libgomp.
  build:
    name: ${{ matrix.compiler.cxx }} / ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - {cxx: g++-13, packages: g++-13}
          - {cxx: g++-14, packages: g++-14}
          - {cxx: clang++-18, packages: clang-18 libomp-18-dev}
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev libnetcdf-dev ninja-build \
            ${{ matrix.compiler.packages }}
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DYSPEC_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      # Debug leaves out the slow full-workflow tests (label slow): without
      # optimisation they take tens of minutes, and their quick counterparts
      # cover the same code.
      - name: Test
        run: >
          ctest --test-dir build --output-on-failure
          ${{ matrix.build_type == 'Debug' && '-LE slow' || '' }}

  # The serial build, which must give the same answers.
  serial:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev libnetcdf-dev ninja-build
      - name: Configure
        run: cmake --preset serial -G Ninja
      - name: Build
        run: cmake --build --preset serial --parallel
      - name: Test
        run: ctest --preset serial

  # The build the Python wheels make: pocketfft in place of FFTW.
  pocketfft:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnetcdf-dev ninja-build
      - name: Configure
        run: cmake --preset pocketfft -G Ninja -DYSPEC_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset pocketfft --parallel
      - name: Test
        run: ctest --preset pocketfft

  # The Python package, built from the sources as pip builds it.
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install ".[test]"
      - name: Test
        run: pytest

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check formatting
        run: |
          clang-format-18 --dry-run --Werror \
            YSpec/*.hpp src/*.hpp src/*.cpp app/*.hpp app/*.cpp tests/*.cpp \
            tests/regression/*.cpp examples/*.cpp python/src/*.cpp
