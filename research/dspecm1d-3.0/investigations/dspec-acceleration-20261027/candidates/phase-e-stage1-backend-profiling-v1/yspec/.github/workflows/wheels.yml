name: Wheels

# The Python package, yspec-seismo: wheels for Linux (x86_64 and aarch64) and
# macOS (arm64), and the source distribution, built on every change to the
# package; published to PyPI when a tag v* is pushed, and to TestPyPI when the
# workflow is run by hand. Publishing uses trusted publishing: the project on
# each index names this repository, this workflow and the environment ("pypi"
# or "testpypi"), and no token is kept here. See docs/publishing.md.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - pyproject.toml
      - python/**
      - .github/workflows/wheels.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@v5
      # Built and tested as pyproject.toml's [tool.cibuildwheel] says.
      - uses: pypa/cibuildwheel@v3.4.1
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build the source distribution
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [wheels, sdist]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The tag must name the version built, CMake's project version.
      - name: Check the tag against the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          ls dist/yspec_seismo-"$version".tar.gz > /dev/null || {
            echo "tag $GITHUB_REF_NAME is not the version built:" dist/*.tar.gz
            exit 1
          }
      - uses: pypa/gh-action-pypi-publish@release/v1

  # A rehearsal, run by hand from the Actions tab.
  publish-test:
    needs: [wheels, sdist]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A file of a version goes up once; a second rehearsal skips it.
          skip-existing: true
